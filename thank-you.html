<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>تمام — بنحوّلك على واتساب</title>
<style>
:root{--font:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  --bg:#0b1618;--surface:#122225;--line:#23434a;
  --ink:#f2f7f6;--ink-soft:#a6c0c0;--brand:#13c2a0;--brand-ink:#05201c;--radius:16px}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){
  --bg:#f5f9f9;--surface:#fff;--line:#d7e6e5;
  --ink:#0b1618;--ink-soft:#4b6a6a;--brand:#0c9b80;--brand-ink:#fff}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.75;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:grid;place-items:center;padding:24px 0}
.wrap{width:min(480px,92%);text-align:center}
.logo{font-weight:700;font-size:1.3rem;margin-bottom:22px}
.logo span{color:var(--brand)}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:20px}
.steps i{width:34px;height:4px;border-radius:99px;background:var(--brand)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:34px 26px}
.tick{width:64px;height:64px;border-radius:50%;background:var(--brand);color:var(--brand-ink);
  display:grid;place-items:center;font-size:1.9rem;margin:0 auto 18px}
h1{font-size:clamp(1.3rem,4.5vw,1.65rem);margin-bottom:8px}
p{color:var(--ink-soft);font-size:.97rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;
  margin-top:22px;padding:17px;background:#25D366;color:#fff;font-weight:700;font-size:1.02rem;
  border:0;border-radius:12px;text-decoration:none;font-family:inherit;
  transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.micro{font-size:.85rem;margin-top:14px}
.back{display:inline-block;margin-top:18px;color:var(--ink-soft);font-size:.87rem;
  text-decoration:underline;text-underline-offset:3px}
</style>
</head>

<div class="wrap">
  <div class="logo">bond<span>.</span></div>
  <div class="steps"><i></i><i></i></div>
  <div class="card">
    <div class="tick">✓</div>
    <h1 id="hi">وصلتنا بياناتك</h1>
    <p>بنفتحلك واتساب دلوقتي برسالة جاهزة — ابعتها وهنرد عليك في نفس اليوم.</p>
    <a class="btn" id="wa" href="#" target="_blank" rel="noopener">

      افتح واتساب
    </a>
    <p class="micro" id="note">بنحوّلك خلال <b id="c">2</b> ثانية…</p>
    <a class="back" href="./">ارجع للصفحة الرئيسية</a>
  </div>
</div>
